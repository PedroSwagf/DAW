<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox: Diseño de tarjeta</title>
    <link rel="stylesheet" href="tarjeta.css">
</head>
<body>
    <div class="container">
        <div class="cabecera">
            <div>
                <h1 id="titulo">
                TARJETA DE ACCESO
                </h1>
            </div>
            <div>
                <button id="botoncierre"><span>X</span></button>
            </div>
        </div>
        <div class="cuerpo">
            <div >
                <img src="imagenes/ejemplo02-persona.png" alt="imagen" id="imagen">
            </div>
            <div id="texto">
                <p><span>Nombre:</span> Pedro Fernández</p>
                <p><span>Ocupación:</span> Estudiante</p>
                <p><span>Ubicación:</span> Moaña,Pontevedra,España</p>
            </div>
        </div>
        <div class="pie">
            <button id="entrada">Fichar entrada</button>
            <button id="salida">Fichar salida</button>
            <button id="historial">Historial</button>
        </div>
    </div>
</body>
</html>
