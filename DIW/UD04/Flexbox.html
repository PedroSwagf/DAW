<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio Flexbox</title>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .contenedor {
            display: flex;
            background-color: #f0f0f0;
            border: 2px solid #f0f0f0;
            padding: 20px;
            width: 95%;
            text-align: center;
        }

        .item1,.item3 {
            flex: 1;
            font-weight: bold;
            background-color: #b3e5fc;
            border: 2px solid #3098d8;
            padding: 20px 0;
        }

        .item2 {
            flex: 2;
            font-weight: bold;
            background-color: #b3e5fc;
            border: 2px solid #3098d8;
            padding: 20px 0;
        }

    </style>
</head>
<body>
    <div class="contenedor">
        <div class="item1">
            Ítem 1
        </div>
        <div class="item2">
            Ítem 2
        </div>
        <div class="item3">
            Ítem 3
        </div>
    </div>
    
</body>
</html>
