<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Musical</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🎵 Mundo Musical – Escucha antes de comprar</h1>
    </header>
    <main class="catalogo">
        <div class="instrument">
            <h2 class="titulo">Guitarra Acústica</h2>
            <img src="img/guitarra.jpg" alt="Guitarra" class="imagen">
            <audio controls src="audio/guitarra.mp3" class="audio"></audio>
        </div>
        <div class="instrument">
            <h2 class="titulo">Saxofon</h2>
            <img src="img/saxofon.jpg" alt="Saxofon" class="imagen">
            <audio controls src="audio/saxofon.mp3" class="audio"></audio>
        </div>
        <div class="instrument">
            <h2 class="titulo">Piano</h2>
            <img src="img/piano.jpg" alt="Piano" class="imagen">
            <audio controls src="audio/piano.mp3" class="audio"></audio>
        </div>
    </main>
</body>
</html>
