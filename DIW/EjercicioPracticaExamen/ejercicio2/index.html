<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio2</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="cabecera">
        <h1>Actuaciones destacadas en Eurovisión</h1>

        <p>Descubre algunas de las actuaciones mas destacadas 💖
            de Eurovisión con subtitulos en español y ingles.
        </p>
    </div>
    <div class="contenedor">
        <figure class="video">          
            <video controls poster="img/poster1.jpg" >
                <source src="assets/videos/video1.mp4" type="video/mp4">
                <track src="assets/videos/video1_es.vtt" kind="subtitles" srclang="es" label="Español" default>
                <track src="assets/videos/video1_en.vtt" kind="subtitles" srclang="en" label="English">
            </video>
            <figcaption>Melody - "Esa diva" - España (Puesto 24)</figcaption>
        </figure>
        <figure class="video">
            <video controls poster="img/poster2.jpg" >
                <source src="assets/videos/video2.mp4" type="video/mp4">
                <track src="assets/videos/video2_es.vtt" kind="subtitles" srclang="es" label="Español" default>
                <track src="assets/videos/video2_en.vtt" kind="subtitles" srclang="en" label="English">
            </video>
            <figcaption>Johannes Pietsch - "Wasted Love" - Austria (1er puesto)</figcaption>
        </figure>
        <figure  class="video">
            <video controls poster="img/poster3.jpg">
                <source src="assets/videos/video3.mp4" type="video/mp4">
                <track src="assets/videos/video3_es.vtt" kind="subtitles" srclang="es" label="Español" default>
                <track src="assets/videos/video3_en.vtt" kind="subtitles" srclang="en" label="English">
            </video>
            <figcaption>Yuval Raphael - "New day will rise" - Israel (2do puesto)</figcaption>
        </figure>
    </div>
    <div class="pie">
        <p>© 2024 Eurovisión. Todos los derechos reservados.</p>
    </div>
</body>
</html>
