<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Actuaciones destacadas en eurovision</h1>
        <p>Descubre algunas de las Actuaciones 💖
            de eurovision con subtitulos en español y ingles.
        </p>
    </header>
    <main>
        <figure class="videos">
            <video controls poster="img/poster1.jpg">
                <source src="assets/videos/video1.mp4" type="video/mp4">
                <track src="assets/videos/video1_es.vtt" rclang="es" kind="subtitles" label="español" default>
                <track src="assets/videos/video1_en.vtt" srclang="en" kind="subtitles" label="english">
            </video>
            <figcaption>Melody - "Esa diva" - España (Puesto 24)</figcaption>
        </figure >
        <figure class="videos">
            <video controls poster="img/poster2.jpg">
                <source src="assets/videos/video2.mp4" type="video/mp4">
                <track src="assets/videos/video2_es.vtt" rclang="es" kind="subtitles" label="español" default>
                <track src="assets/videos/video2_en.vtt" srclang="en" kind="subtitles" label="english">
            </video>
            <figcaption>Melody - "Esa diva" - España (Puesto 24)</figcaption>
        </figure >
        <figure class="videos">
            <video controls poster="img/poster3.jpg">
                <source src="assets/videos/video3.mp4" type="video/mp4">
                <track src="assets/videos/video3_es.vtt" rclang="es" kind="subtitles" label="español" default>
                <track src="assets/videos/video3_en.vtt" srclang="en" kind="subtitles" label="english">
            </video>
            <figcaption>Melody - "Esa diva" - España (Puesto 24)</figcaption>
        </figure class="">
    </main>
    <footer>
        <p>2025 Eurovisión - Actuaciones destacadas</p>
    </footer>
</body>
</html>
